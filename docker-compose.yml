services:
  zapret:
    build:
      context: .
      dockerfile: zapret/Dockerfile
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID, KILL]
    dns: [127.0.0.1]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - zapret_state:/state
      - control_auth:/auth
      - ./config:/app/config:ro
    networks:
      management:
        ipv4_address: 172.30.0.2
      lab_net:
        ipv4_address: 172.31.0.2
      uplink:
        gw_priority: 1
    healthcheck:
      test: [CMD, python, -m, harness.node, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  client:
    dns: [172.31.0.2]
    build:
      context: .
      dockerfile: client/Dockerfile
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    volumes:
      - control_auth:/auth:ro
      - ./config:/app/config:ro
    networks:
      lab_net:
        ipv4_address: 172.31.0.3
    depends_on:
      zapret:
        condition: service_healthy
    restart: unless-stopped
  harness:
    build:
      context: .
      dockerfile: harness/Dockerfile
    cap_drop: [ALL]
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - control_auth:/auth:ro
    networks:
      management:
        ipv4_address: 172.30.0.3
      uplink:
        gw_priority: 1
    depends_on:
      zapret:
        condition: service_healthy
      client:
        condition: service_started
networks:
  management:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  lab_net:
    # Docker's internal bridge filter drops transit packets before the peer router.
    # No host gateway address or host masquerade: Zapret is the only IPv4 exit.
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 172.31.0.0/24
  uplink: {}
volumes:
  zapret_state:
  control_auth:
